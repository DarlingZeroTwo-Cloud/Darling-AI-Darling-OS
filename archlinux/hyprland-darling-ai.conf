# Darling AI for Darling OS —— Hyprland 集成
# 用法一：把本文件复制到 ~/.config/hypr/ 并在 hyprland.conf 里加一行
#   source = ~/.config/hypr/hyprland-darling-ai.conf
# 用法二：直接把这 3 行粘贴进 hyprland.conf
#
# Windows 键 = SUPER（$mainMod），Win+Ctrl+D 唤起/收起完整窗口
# 悬浮小圆点常驻所有虚拟桌面（special workspace，见下），点击出小悬浮窗快速对话

# ── 全局快捷键 ──
bind = SUPER CTRL, D, exec, darling-ai-toggle

# ── 开机自启常驻（systemd 用户服务） ──
exec-once = systemctl --user enable --now darling-ai.service

# ── 图形环境变量导入 systemd 用户服务（Wayland/DBus 必需） ──
exec-once = systemctl --user import-environment WAYLAND_DISPLAY DISPLAY XDG_RUNTIME_DIR

# ── 悬浮球/悬浮窗：常驻所有虚拟桌面 ──
# 放进 special workspace（Hyprland 覆盖层，所有常规工作区均可见）
windowrulev2 = workspace special:darlingai, class:(darling_ai), title:(darling-ball)
windowrulev2 = workspace special:darlingai, class:(darling_ai), title:(darling-panel)
# 无边框 + 置顶 + 浮动 + 不抢占焦点
windowrulev2 = noinitialfocus, class:(darling_ai), title:(darling-ball)
windowrulev2 = noinitialfocus, class:(darling_ai), title:(darling-panel)
windowrulev2 = float, class:(darling_ai), title:(darling-panel)
# 主窗口常驻关窗（应用内已拦截为隐藏）
windowrulev2 = noinitialfocus, class:(darling_ai), title:(Darling AI)
