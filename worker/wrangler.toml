name = "darling-ai-cloud"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "darling-ai-cloud"
database_id = "REPLACE_WITH_D1_ID"

[vars]
AGNES_BASE_URL = "https://apihub.agnes-ai.com/v1"
WINDOW_HOURS = "5"
TEXT_LIMIT = "30000000"
IMAGE_LIMIT = "10"
MODEL_SLUG = "02"
