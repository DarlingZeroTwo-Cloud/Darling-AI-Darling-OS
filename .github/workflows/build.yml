name: build-darling-ai-darling-os

on:
  workflow_dispatch:
  push:
    tags:
      - 'v4.1.9*'

permissions:
  contents: write

jobs:
  # ============================================================
  # Arch Linux 专属发行版：构建 Flutter Linux 产物 + Python 后端，
  # 在 Arch 容器内用 makepkg 打成 .pkg.tar.zst（pacman 专属格式）
  # ============================================================
  build-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev ninja-build pkg-config liblzma-dev cmake build-essential
          pip install pyinstaller requests

      - name: Build Flutter Linux
        run: |
          rm -rf app/lib
          cp -r app_src/lib app/lib
          cp app_src/pubspec.yaml app/pubspec.yaml
          cd app
          flutter pub get
          if [ ! -d linux ]; then flutter create --platforms=linux .; fi
          sed -i 's/set(BINARY_NAME "app")/set(BINARY_NAME "darling_ai")/' linux/CMakeLists.txt
          sed -i 's/gtk_window_set_title(window, "app")/gtk_window_set_title(window, "darling-ai")/' linux/runner/my_application.cc || true
          # 注入 desktop_multi_window 子窗口插件注册回调（多窗口必需）
          python3 - <<'PYEOF'
          import re
          p = 'linux/runner/my_application.cc'
          src = open(p, encoding='utf-8').read()
          if 'desktop_multi_window_plugin_set_window_created_callback' not in src:
              # 加 include
              src = src.replace(
                  '#include "my_application.h"',
                  '#include "my_application.h"\n#include "desktop_multi_window/desktop_multi_window_plugin.h"',
              )
              # 在 fl_register_plugins 后注册子窗口回调
              src = src.replace(
                  'fl_register_plugins(FL_PLUGIN_REGISTRY(view));',
                  'fl_register_plugins(FL_PLUGIN_REGISTRY(view));\n  desktop_multi_window_plugin_set_window_created_callback([](FlPluginRegistry* registry) { fl_register_plugins(registry); });',
              )
              open(p, 'w', encoding='utf-8').write(src)
          print('my_application.cc patched' if 'desktop_multi_window_plugin_set_window_created_callback' in src else 'NO-CHANGE')
          PYEOF
          flutter build linux --release

      - name: Build Python backend
        run: |
          cd backend
          pyinstaller --onefile --name darling-backend --noconsole bridge_server.py \
            --collect-all requests

      - name: Assemble Arch bundle
        run: |
          BUNDLE="bundle/darling-ai-bundle"
          mkdir -p "$BUNDLE/backend" "$BUNDLE/plugins"
          cp -r app/build/linux/x64/release/bundle/* "$BUNDLE/"
          cp backend/dist/darling-backend "$BUNDLE/backend/"
          cp backend/plugins/*.json "$BUNDLE/plugins/" 2>/dev/null || true
          cp assets/* "$BUNDLE/" 2>/dev/null || true
          # 关闭主窗口时保持常驻的最小配置
          echo '{"daemon":true}' > "$BUNDLE/daemon.json"
          tar -czf archlinux/darling-ai-bundle.tar.gz -C bundle darling-ai-bundle

      - name: Build Arch package (.pkg.tar.zst)
        run: |
          # makepkg 不允许 root 运行：容器内建普通用户
          docker run --rm \
            -v "$PWD/archlinux:/work:Z" \
            -w /work \
            docker.io/archlinux/archlinux:base-devel bash -lc "
              pacman -Sy --noconfirm --needed >/dev/null 2>&1
              useradd -m builder 2>/dev/null || true
              chown -R builder:builder /work
              sudo -u builder makepkg -f --noconfirm 2>&1 | tail -20
            "
          ls -lh archlinux/*.pkg.tar.zst

      - name: Upload arch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darling-ai-darling-os-4.1.9
          path: |
            archlinux/*.pkg.tar.zst
            archlinux/darling-ai-bundle.tar.gz

      - name: Release upload (Arch)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            archlinux/*.pkg.tar.zst
            archlinux/darling-ai-bundle.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
