name: build-3.4.5

on:
  workflow_dispatch:
  push:
    tags:
      - 'v3.4.5*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install pyinstaller requests
          choco install innosetup -y

      - name: Build Flutter Windows
        run: |
          Remove-Item -Recurse -Force app\lib -ErrorAction SilentlyContinue
          Copy-Item -Recurse app_src\lib app\lib
          Copy-Item app_src\pubspec.yaml app\pubspec.yaml -Force
          cd app
          flutter pub get
          flutter build windows --release
        shell: pwsh

      - name: Build Python backend
        run: |
          cd backend
          pyinstaller --onefile --name darling-backend --noconsole bridge_server.py --collect-all requests
        shell: pwsh

      - name: Assemble dist
        run: |
          $DIST = "dist\darling-ai-3.4.5"
          New-Item -ItemType Directory -Force $DIST | Out-Null
          New-Item -ItemType Directory -Force "$DIST\backend" | Out-Null
          New-Item -ItemType Directory -Force "$DIST\plugins" | Out-Null
          Copy-Item -Recurse "app\build\windows\x64\runner\Release\*" $DIST\
          Copy-Item "backend\dist\darling-backend.exe" "$DIST\backend\"
          Copy-Item "backend\plugins\*.json" "$DIST\plugins\" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Pack portable zip
        run: |
          Compress-Archive -Path "dist\darling-ai-3.4.5\*" -DestinationPath "darling-ai-3.4.5-portable.zip" -Force
        shell: pwsh

      - name: Build installer (Chinese UI)
        run: |
          # 中文语言文件已随仓库提交（带 UTF-8 BOM，ISCC 才能正确识别）
          $langFile = "$env:GITHUB_WORKSPACE\installer\ChineseSimplified.isl"
          Write-Host "Language file: $langFile"
          $langLine = "Name: `"chinesesimplified`"; MessagesFile: `"$langFile`""
          $iss = @"
          #define MyAppName "darling-ai"
          #define MyAppVersion "3.4.5"
          #define MyAppPublisher "darling"
          #define MyAppExeName "darling_ai.exe"
          [Setup]
          AppId={{8F3A2B1E-4C5D-7E8F-9A0B-1C2D3E4F5A6B}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppVerName=darling-ai {#MyAppVersion}
          DefaultDirName={autopf}\darling-ai
          DefaultGroupName=darling-ai
          AllowNoIcons=yes
          DisableProgramGroupPage=yes
          OutputDir=.
          OutputBaseFilename=darling-ai-3.4.5-setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\{#MyAppExeName}
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          CloseApplications=yes
          [Languages]
          $langLine
          [Tasks]
          Name: "desktopicon"; Description: "Create desktop shortcut"; GroupDescription: "Additional tasks:"; Flags: checkedonce
          [Files]
          Source: "dist\darling-ai-3.4.5\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\darling-ai"; Filename: "{app}\{#MyAppExeName}"
          Name: "{group}\Uninstall darling-ai"; Filename: "{uninstallexe}"
          Name: "{commondesktop}\darling-ai"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch darling-ai"; Flags: nowait postinstall skipifsilent
          [UninstallDelete]
          Type: filesandordirs; Name: "{app}\*"
          Type: dirifempty; Name: "{app}"
          [Code]
          procedure KillAppProcesses;
          var R: Integer;
          begin
            Exec('taskkill.exe', '/F /IM darling_ai.exe /T', '', SW_HIDE, ewWaitUntilTerminated, R);
            Exec('taskkill.exe', '/F /IM darling-backend.exe /T', '', SW_HIDE, ewWaitUntilTerminated, R);
            Sleep(600);
          end;
          function PrepareToInstall(var NeedsRestart: Boolean): String;
          begin Result := ''; KillAppProcesses; end;
          function InitializeUninstall(): Boolean;
          begin Result := True; KillAppProcesses; end;
          "@
          $iss | Out-File -FilePath "build-installer.iss" -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build-installer.iss
        shell: pwsh

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darling-ai-3.4.5-windows
          path: |
            darling-ai-3.4.5-portable.zip
            darling-ai-3.4.5-setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev ninja-build pkg-config liblzma-dev cmake build-essential
          pip install pyinstaller requests

      - name: Build Flutter Linux
        run: |
          rm -rf app/lib
          cp -r app_src/lib app/lib
          cp app_src/pubspec.yaml app/pubspec.yaml
          cd app
          flutter pub get
          if [ ! -d linux ]; then flutter create --platforms=linux .; fi
          sed -i 's/set(BINARY_NAME "app")/set(BINARY_NAME "darling_ai")/' linux/CMakeLists.txt
          sed -i 's/gtk_window_set_title(window, "app")/gtk_window_set_title(window, "darling-ai")/' linux/runner/my_application.cc || true
          flutter build linux --release

      - name: Build Python backend
        run: |
          cd backend
          pyinstaller --onefile --name darling-backend --noconsole bridge_server.py \
            --collect-all requests

      - name: Assemble tar.gz
        run: |
          DIST=dist/darling-ai-3.4.5
          rm -rf dist
          mkdir -p $DIST/backend $DIST/plugins
          cp -r app/build/linux/x64/release/bundle/. $DIST/
          cp backend/dist/darling-backend $DIST/backend/
          chmod +x $DIST/backend/darling-backend
          cp backend/plugins/*.json $DIST/plugins/ 2>/dev/null || true
          tar czf darling-ai-3.4.5-linux-x64.tar.gz dist/

      - name: Build deb package (all runtime deps bundled, offline install)
        run: |
          DIST=dist/darling-ai-3.4.5
          PKG=darling-ai_3.4.5_amd64
          rm -rf $PKG
          mkdir -p $PKG/DEBIAN $PKG/usr/share/darling-ai $PKG/usr/bin $PKG/usr/share/applications
          # 应用本体（Flutter bundle 自带全部 Flutter 库；backend 为 PyInstaller onefile，自带 Python 解释器）
          cp -r $DIST/. $PKG/usr/share/darling-ai/
          # 启动命令：darling-ai
          cat > $PKG/usr/bin/darling-ai <<'EOS'
          #!/bin/sh
          exec /usr/share/darling-ai/darling_ai "$@"
          EOS
          chmod +x $PKG/usr/bin/darling-ai
          # 桌面入口
          cat > $PKG/usr/share/applications/darling-ai.desktop <<'EOS'
          [Desktop Entry]
          Name=darling-ai
          Comment=DARLING-AI desktop AI assistant
          Exec=/usr/share/darling-ai/darling_ai
          Type=Application
          Categories=Utility;
          EOS
          # control：仅声明最基础的 GTK 系统库（绝大多数发行版自带，无需联网装 Python/Flutter）
          cat > $PKG/DEBIAN/control <<'EOS'
          Package: darling-ai
          Version: 3.4.5
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: darling
          Depends: libgtk-3-0 (>= 3.24)
          Description: DARLING-AI desktop AI assistant
          EOS
          chmod +x $PKG/usr/share/darling-ai/darling_ai
          chmod +x $PKG/usr/share/darling-ai/backend/darling-backend
          chmod 644 $PKG/usr/share/applications/darling-ai.desktop
          dpkg-deb --build --root-owner-group $PKG darling-ai-3.4.5-amd64.deb

      - name: Verify deb package (install + dependency check)
        run: |
          echo "===== dpkg-deb info ====="
          dpkg-deb --info darling-ai-3.4.5-amd64.deb
          echo "===== contents (head) ====="
          dpkg-deb --contents darling-ai-3.4.5-amd64.deb | head -20
          echo "===== actually install ====="
          sudo dpkg -i darling-ai-3.4.5-amd64.deb
          which darling-ai
          dpkg -s darling-ai | grep -E "Package|Version|Status"
          echo "===== dependency check (ldd) ====="
          ldd /usr/share/darling-ai/darling_ai 2>&1 | grep -i "not found" && { echo "GUI LIBS MISSING"; exit 1; } || echo "GUI libs OK"
          ldd /usr/share/darling-ai/backend/darling-backend 2>&1 | grep -i "not found" && { echo "BACKEND LIBS MISSING"; exit 1; } || echo "Backend libs OK"
          echo "===== tar.gz lib check ====="
          tar tzf darling-ai-3.4.5-linux-x64.tar.gz | head -10

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: darling-ai-3.4.5-linux
          path: |
            darling-ai-3.4.5-linux-x64.tar.gz
            darling-ai-3.4.5-amd64.deb
