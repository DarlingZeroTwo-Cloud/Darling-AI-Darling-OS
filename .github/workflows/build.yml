name: build-3.1.9

on:
  workflow_dispatch:
  push:
    tags:
      - 'v3.1.9*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install pyinstaller requests

      - name: Build Flutter Windows
        run: |
          Remove-Item -Recurse -Force app\lib -ErrorAction SilentlyContinue
          Copy-Item -Recurse app_src\lib app\lib
          Copy-Item app_src\pubspec.yaml app\pubspec.yaml -Force
          cd app
          flutter pub get
          flutter build windows --release
        shell: pwsh

      - name: Build Python backend
        run: |
          cd backend
          pyinstaller --onefile --name darling-backend --noconsole bridge_server.py --add-data "models_catalog.json;." --collect-all requests
        shell: pwsh

      - name: Assemble dist
        run: |
          $DIST = "dist\darling-ai-3.1.9"
          New-Item -ItemType Directory -Force $DIST | Out-Null
          New-Item -ItemType Directory -Force "$DIST\backend" | Out-Null
          New-Item -ItemType Directory -Force "$DIST\plugins" | Out-Null
          Copy-Item -Recurse "app\build\windows\x64\runner\Release\*" $DIST\
          Copy-Item "backend\dist\darling-backend.exe" "$DIST\backend\"
          Copy-Item "backend\plugins\*.json" "$DIST\plugins\" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Pack portable zip (no installer)
        run: |
          Compress-Archive -Path "dist\darling-ai-3.1.9\*" -DestinationPath "darling-ai-3.1.9-portable.zip" -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darling-ai-3.1.9-windows
          path: darling-ai-3.1.9-portable.zip
